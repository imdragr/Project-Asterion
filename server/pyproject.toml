[project]
name = "asterion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.3",
    "pydantic-settings>=2.14.1",
    "sqlalchemy[asyncio]>=2.0.50",
    "uvicorn[standard]>=0.48.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "psycopg2-binary>=2.9.12",
    "pytest>=9.0.3",
    "pytest-alembic>=0.12.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.14",
    "testcontainers>=4.14.2",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
] # includes isort (I) → replaces Black+isort+Flake8

[tool.ruff.lint.per-file-ignores]
# These imports ARE the tests — importing them registers the pytest-alembic
# checks. They are intentionally "unused"; never let --fix strip them.
"tests/test_migration.py" = ["F401"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

# testcontainers ships no type stubs / py.typed marker — don't fail on it.
[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
